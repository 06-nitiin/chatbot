<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>chatbot // v3</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<base target="_blank">
</head>
<body>
  <div class="crt">
    <div class="terminal">
      <header class="term-head">
        <div class="term-head-left">
          <span class="dot"></span>
          <span class="term-title">chatbot<span class="term-title-dim">.session</span></span>
        </div>
        <div class="term-head-right">
          <button id="clear-btn" class="clear-btn" title="Clear conversation">clear</button>
          <span id="clock">--:--:--</span>
        </div>
      </header>

      <div class="term-meta">
        <span>engine: hybrid v3</span>
        <span>context: <span id="context-status">active</span></span>
        <span>intents loaded: <span id="intent-count">13</span></span>
        <span class="status-live">● online</span>
      </div>

      <main class="log" id="log" aria-live="polite">
        <div class="line bot">
          <span class="who">BOT&gt;</span>
          <span class="text">Hi. I now remember our conversation context — try "hi", "give me advice", then "another one". You can also click the mic to talk.</span>
        </div>
      </main>

      <div class="typing-indicator hidden" id="typing-indicator">
        <span class="who">BOT&gt;</span>
        <span class="dots"><span></span><span></span><span></span></span>
      </div>

      <form class="prompt-row" id="prompt-form" autocomplete="off">
        <span class="prompt-label">YOU&gt;</span>
        <input
          type="text"
          id="prompt-input"
          class="prompt-input"
          placeholder="type or speak a message..."
          autofocus
        >
        <span class="cursor" aria-hidden="true"></span>
        <button type="button" id="mic-button" class="mic-button" title="Speak your message" aria-label="Voice input">
          <svg class="mic-icon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
            <path fill="currentColor" d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z"/>
            <path fill="currentColor" d="M19 11a1 1 0 0 0-2 0 5 5 0 0 1-10 0 1 1 0 0 0-2 0 7 7 0 0 0 6 6.92V20H9a1 1 0 0 0 0 2h6a1 1 0 0 0 0-2h-2v-2.08A7 7 0 0 0 19 11z"/>
          </svg>
        </button>
      </form>
      <div class="mic-status" id="mic-status" aria-live="polite"></div>
    </div>
    <p class="footnote">context-aware bot &middot; local AI fallback &middot; <a href="https://github.com/06-nitiin/chatbot" target="_blank" rel="noopener">source</a></p>
  </div>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
